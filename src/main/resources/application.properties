server.port=8080
spring.application.name=password-health-analytics

# Връзка с SQL Server (за именувана инстанция MSSQLSERVER01)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=password_analytics;encrypt=true;trustServerCertificate=true;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate Настройки
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect